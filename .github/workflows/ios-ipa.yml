name: Shelf IPA

on:
  workflow_dispatch:

concurrency:
  group: shelf-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate the iOS project
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          EXPO_NO_DOCTOR: "1"
          EXPO_PUBLIC_API_URL: https://shelf-xi-hazel.vercel.app
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Archive without signing
        env:
          CI: "1"
          EXPO_PUBLIC_API_URL: https://shelf-xi-hazel.vercel.app
        run: |
          set -euo pipefail
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Shelf.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package Shelf.ipa
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/Shelf.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          # A phone rejects a bundle with no signature at all. An ad-hoc
          # signature makes this a real IPA. Sideload still replaces it
          # with your Apple ID.
          codesign --force --deep --sign - "$APP"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          # -X keeps the archive free of Mac resource-fork extras that
          # make installers call the file the wrong type.
          (cd "$RUNNER_TEMP" && zip -r -y -X Shelf.ipa Payload)
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mv "$RUNNER_TEMP/Shelf.ipa" "$GITHUB_WORKSPACE/dist/Shelf.ipa"
          ls -lh "$GITHUB_WORKSPACE/dist/Shelf.ipa"

      - name: Upload Shelf.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Shelf
          path: dist/Shelf.ipa
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish the IPA and the direct link
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The Actions artifact is a zip around the IPA. macOS will not
          # open that wrapper. The release asset is Shelf.ipa itself.
          version=$(node -p "require('./apps/mobile/app.json').expo.version")
          build=$(node -p "require('./apps/mobile/app.json').expo.ios.buildNumber")
          named="Shelf-${version}-${build}.ipa"
          cp dist/Shelf.ipa "dist/${named}"
          # Feather adds altstore.json from this release. Its downloadURL is the
          # versioned IPA just built (Shelf-<version>-<build>.ipa), not a
          # stable filename. Category must stay "utilities": Feather rejects
          # the whole source for anything outside AltStore's fixed list.
          plist=$(unzip -l "dist/${named}" | awk '{ print $4 }' | grep -m 1 -E '^Payload/[^/]+\.app/Info\.plist$' || true)
          if [ -z "$plist" ]; then
            echo "IPA is missing Info.plist" >&2
            exit 1
          fi
          unzip -p "dist/${named}" "$plist" > "$RUNNER_TEMP/Info.plist"
          min_os=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$RUNNER_TEMP/Info.plist")
          short=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/Info.plist")
          built=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/Info.plist")
          bid=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/Info.plist")
          test -n "$min_os"
          test "$short" = "$version"
          test "$built" = "$build"
          test "$bid" = "$(node -p "require('./apps/mobile/app.json').expo.ios.bundleIdentifier")"
          # Build and validate altstore.json before touching the release, so a
          # bad source fails the run while the previous release is still up.
          node scripts/altstore-source.mjs --ipa "dist/${named}" --out dist/altstore.json --min-os "$min_os"
          node scripts/altstore-source.mjs --validate dist/altstore.json
          # Upload the IPA first so the source's downloadURL exists, then
          # replace altstore.json with the version and build this run produced.
          gh release delete ipa --yes --cleanup-tag || true
          gh release create ipa "dist/${named}" dist/Shelf.ipa \
            --target "$GITHUB_SHA" \
            --title "Shelf ${version} (${build})" \
            --notes "Shelf ${version} (${build}). Download ${named}, or Shelf.ipa. Do not unzip it, and do not use the Actions artifact zip. Feather source: https://github.com/${GITHUB_REPOSITORY}/releases/download/ipa/altstore.json" \
            --latest=false
          gh release upload ipa dist/altstore.json --clobber
          asset=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/ipa" --jq ".assets[] | select(.name==\"${named}\") | .id")
          url=$(curl -sI \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset}" \
            | awk 'tolower($1)=="location:" { print $2 }' | tr -d '\r')
          test -n "$url"
          {
            echo "### ${named}"
            echo "Version ${version}, build ${build}. This link is the app file. It lasts about ten minutes."
            echo ""
            echo "$url"
            echo ""
            echo "After it expires, download [${named}](https://github.com/${GITHUB_REPOSITORY}/releases/download/ipa/${named}) while signed in to GitHub. Sideload that file. Do not unzip it, and do not download the Actions artifact named Shelf."
            echo ""
            echo "Feather source (same kind of release asset as Critter Clash \`altstore.json\`): https://github.com/${GITHUB_REPOSITORY}/releases/download/ipa/altstore.json"
            echo ""
            echo "That source downloads https://github.com/${GITHUB_REPOSITORY}/releases/download/ipa/${named}"
          } >> "$GITHUB_STEP_SUMMARY"
