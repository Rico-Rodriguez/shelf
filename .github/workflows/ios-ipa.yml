name: Shelf IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - cursor/native-parity-08b4
      - cursor/ipa-download-link-be4e
    paths:
      - "apps/mobile/**"
      - ".github/workflows/ios-ipa.yml"

concurrency:
  group: shelf-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate the iOS project
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          EXPO_NO_DOCTOR: "1"
          EXPO_PUBLIC_API_URL: https://shelf-xi-hazel.vercel.app
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Archive without signing
        env:
          CI: "1"
          EXPO_PUBLIC_API_URL: https://shelf-xi-hazel.vercel.app
        run: |
          set -euo pipefail
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Shelf.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package Shelf.ipa
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/Shelf.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          # A phone rejects a bundle with no signature at all. An ad-hoc
          # signature makes this a real IPA. Sideload still replaces it
          # with your Apple ID.
          codesign --force --deep --sign - "$APP"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          # -X keeps the archive free of Mac resource-fork extras that
          # make installers call the file the wrong type.
          (cd "$RUNNER_TEMP" && zip -r -y -X Shelf.ipa Payload)
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mv "$RUNNER_TEMP/Shelf.ipa" "$GITHUB_WORKSPACE/dist/Shelf.ipa"
          ls -lh "$GITHUB_WORKSPACE/dist/Shelf.ipa"

      - name: Upload Shelf.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Shelf
          path: dist/Shelf.ipa
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish the IPA and the direct link
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The Actions artifact is a zip around the IPA. macOS will not
          # open that wrapper. The release asset is Shelf.ipa itself.
          version=$(node -p "require('./apps/mobile/app.json').expo.version")
          build=$(node -p "require('./apps/mobile/app.json').expo.ios.buildNumber")
          named="Shelf-${version}-${build}.ipa"
          cp dist/Shelf.ipa "dist/${named}"
          gh release delete ipa --yes --cleanup-tag || true
          gh release create ipa "dist/${named}" \
            --target "$GITHUB_SHA" \
            --title "Shelf ${version} (${build})" \
            --notes "Shelf ${version} (${build}). Download ${named}. Do not unzip it, and do not use the Actions artifact zip. The copy inside the app is version ${version}." \
            --latest=false
          asset=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/ipa" --jq ".assets[] | select(.name==\"${named}\") | .id")
          url=$(curl -sI \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset}" \
            | awk 'tolower($1)=="location:" { print $2 }' | tr -d '\r')
          test -n "$url"
          {
            echo "### ${named}"
            echo "Version ${version}, build ${build}. This link is the app file. It lasts about ten minutes."
            echo ""
            echo "$url"
            echo ""
            echo "After it expires, download [${named}](https://github.com/${GITHUB_REPOSITORY}/releases/download/ipa/${named}) while signed in to GitHub. Sideload that file. Do not unzip it, and do not download the Actions artifact named Shelf."
          } >> "$GITHUB_STEP_SUMMARY"
